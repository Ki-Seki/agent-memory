[project]
name = "agent-memory-git"
version = "0.1.9"
description = "Shared, git-backed memory for Claude Code and Codex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Shichao Song" }]
keywords = ["claude-code", "codex", "memory", "agents", "git"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
ui = ["numpy>=2.0"]

[project.scripts]
mem = "agent_memory.cli:main"

[project.urls]
Homepage = "https://ki-seki.github.io/agent-memory/"
Documentation = "https://ki-seki.github.io/agent-memory/docs.html"
Demo = "https://ki-seki.github.io/agent-memory/demo/"
Repository = "https://github.com/Ki-Seki/agent-memory"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_memory"  # the import name; the distribution is agent-memory-git

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
