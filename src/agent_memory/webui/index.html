<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memories · agent-memory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23BA7517'/%3E%3Cpath d='M8 5.5h5.5L17 9v9.5H8z' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M10.5 12.5h4M10.5 15.5h3' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <header class="head">
    <div class="wrap">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6"/><path d="M8 5.5h5.5L17 9v9.5H8z"/><path d="M10.5 12.5h4M10.5 15.5h3"/></svg>
        <span class="name">agent-memory</span>
        <span class="repo" id="repo"></span>
      </div>
      <div class="status" id="status"></div>
      <button class="btn primary" id="new" title="New memory (n)">New memory</button>
    </div>
  </header>

  <div class="top">
    <div class="wrap">
      <div class="search">
        <svg class="search-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="m10.6 10.6 3.4 3.4"/></svg>
        <input id="q" type="search" placeholder="Search memories" autocomplete="off" spellcheck="false" aria-label="Search memories">
        <kbd>/</kbd>
      </div>
      <div class="filters" id="filters"></div>
      <div class="cols">
        <span></span><span class="c-count" id="count" aria-live="polite"></span><span class="c-type">Type</span><span class="c-place">Loads in</span><span class="c-date" id="date-col"></span>
      </div>
    </div>
  </div>

  <main class="list wrap" id="list" aria-label="Memories"><div id="rows"></div></main>
</div>
<div class="selbar" id="selbar" hidden></div>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="boot" id="boot">Loading memories…</div>
<script src="/app.js"></script>
</body>
</html>
