<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memories</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="search">
      <svg class="search-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="m10.6 10.6 3.4 3.4"/></svg>
      <input id="q" type="search" placeholder="Search memories" autocomplete="off" spellcheck="false" aria-label="Search memories">
      <kbd>/</kbd>
    </div>
    <span class="sync" id="sync" hidden></span>
    <button class="btn primary" id="new" title="New memory (n)">New</button>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main class="list" id="list" aria-label="Memories"></main>
<div class="selbar" id="selbar" hidden></div>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="boot" id="boot">Loading memories…</div>
<script src="/app.js"></script>
</body>
</html>
